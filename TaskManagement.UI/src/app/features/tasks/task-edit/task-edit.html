<div class="container mt-4">

  <div class="card shadow">

    <div class="card-header bg-warning text-dark">
      <h3 class="mb-0">Edit Task -> {{ taskId }}</h3>
    </div>

    <div class="card-body">

      <!-- Loading Spinner -->
      <div *ngIf="isLoading" class="text-center py-5">
        <div class="spinner-border text-warning" role="status">
          <span class="visually-hidden">Loading...</span>
        </div>
        <p class="mt-3 text-muted">Loading task...</p>
      </div>

      <!-- Error Alert -->
      <div *ngIf="errorMessage" class="alert alert-danger alert-dismissible fade show" role="alert">
        <span [innerHTML]="errorMessage"></span>
        <button type="button" class="btn-close" (click)="errorMessage = ''" aria-label="Close"></button>
      </div>

      <!-- Main Form -->
      <form *ngIf="!isLoading" [formGroup]="taskForm" (ngSubmit)="onSubmit()">

        <!-- Task Title -->
        <div class="mb-3">
          <label class="form-label fw-bold">Task Title <span class="text-danger">*</span></label>
          <input 
            type="text" 
            class="form-control" 
            formControlName="title"
            [class.is-invalid]="f['title'].touched && f['title'].invalid"
            placeholder="Enter task title">
          <div *ngIf="f['title'].touched && f['title'].errors?.['required']" class="invalid-feedback">
            Title is required.
          </div>
          <div *ngIf="f['title'].touched && f['title'].errors?.['maxlength']" class="invalid-feedback">
            Title cannot exceed 100 characters.
          </div>
        </div>

        <!-- Description -->
        <div class="mb-3">
          <label class="form-label fw-bold">Description</label>
          <textarea 
            rows="4" 
            class="form-control" 
            formControlName="description"
            [class.is-invalid]="f['description'].touched && f['description'].invalid"
            placeholder="Enter description">
          </textarea>
          <div *ngIf="f['description'].touched && f['description'].errors?.['maxlength']" class="invalid-feedback">
            Description cannot exceed 500 characters.
          </div>
        </div>

        <div class="row">
          <!-- Project Dropdown -->
          <div class="col-md-6 mb-3">
            <label class="form-label fw-bold">Project <span class="text-danger">*</span></label>
            <select 
              class="form-select" 
              formControlName="projectId"
              [class.is-invalid]="f['projectId'].touched && f['projectId'].invalid">
              <option [ngValue]="null" disabled>Select Project</option>
              <option *ngFor="let proj of projects" [value]="proj.id">
                {{ proj.name || proj.title || 'Project #' + proj.id }}
              </option>
            </select>
            <div *ngIf="f['projectId'].touched && f['projectId'].errors?.['required']" class="invalid-feedback">
              Please select a project.
            </div>
          </div>

          <!-- Assigned User Dropdown -->
          <div class="col-md-6 mb-3">
            <label class="form-label fw-bold">Assigned To</label>
            <select class="form-select" formControlName="assignedToUserId">
              <option [ngValue]="null">Unassigned</option>
              <option *ngFor="let user of users" [value]="user.id">
                {{ user.name || user.username || 'User #' + user.id }}
              </option>
            </select>
          </div>
        </div>

        <div class="row">
          <!-- Priority Dropdown -->
          <div class="col-md-4 mb-3">
            <label class="form-label fw-bold">Priority <span class="text-danger">*</span></label>
            <select 
              class="form-select" 
              formControlName="priority"
              [class.is-invalid]="f['priority'].touched && f['priority'].invalid">
              <option *ngFor="let p of priorityOptions" [value]="p">
                {{ p }}
              </option>
            </select>
            <div *ngIf="f['priority'].touched && f['priority'].errors?.['required']" class="invalid-feedback">
              Priority is required.
            </div>
          </div>

          <!-- Status Dropdown -->
          <div class="col-md-4 mb-3">
            <label class="form-label fw-bold">Status <span class="text-danger">*</span></label>
            <select 
              class="form-select" 
              formControlName="status"
              [class.is-invalid]="f['status'].touched && f['status'].invalid">
              <option *ngFor="let s of statusOptions" [value]="s">
                {{ s }}
              </option>
            </select>
            <div *ngIf="f['status'].touched && f['status'].errors?.['required']" class="invalid-feedback">
              Status is required.
            </div>
          </div>

          <!-- Due Date -->
          <div class="col-md-4 mb-3">
            <label class="form-label fw-bold">Due Date <span class="text-danger">*</span></label>
            <input 
              type="date" 
              class="form-control" 
              formControlName="dueDate"
              [class.is-invalid]="f['dueDate'].touched && f['dueDate'].invalid">
            <div *ngIf="f['dueDate'].touched && f['dueDate'].errors?.['required']" class="invalid-feedback">
              Due date is required.
            </div>
          </div>
        </div>

        <!-- Action Buttons -->
        <div class="d-flex gap-2 mt-3">
          <button 
            type="button" 
            class="btn btn-outline-danger" 
            (click)="goBack()"
            [disabled]="isSubmitting">
            Back
          </button>

          <button 
            type="button" 
            class="btn btn-secondary" 
            (click)="loadData()"
            [disabled]="isSubmitting">
            Reload Task
          </button>

          <button 
            type="submit" 
            class="btn btn-warning" 
            [disabled]="isSubmitting">
            <span *ngIf="isSubmitting" class="spinner-border spinner-border-sm me-1"></span>
            {{ isSubmitting ? 'Updating...' : 'Update Task' }}
          </button>
        </div>

      </form>

    </div>

  </div>

</div>
